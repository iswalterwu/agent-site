<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>agent-site</title>
  <style>
    /* 令牌：原始值 → 语义 → 组件。色值与 Canvas 的 theme.ts 同源。 */
    :root[data-theme="day"] {
      --ink-900: #f4f6f9;
      --ink-850: #e9edf2;
      --ink-300: #57606a;
      --ink-100: #1b232b;
      --surface: #f4f6f9;
      --surface-2: rgba(233, 237, 242, .96);
      --surface-3: rgba(222, 228, 235, .96);
      --border: rgba(30, 41, 51, .14);
      --border-strong: rgba(30, 41, 51, .26);
      /* 亮底上原来的橙、红压不住：文字用的强调色和错误色各取一档更深的 */
      --accent: #96600f;
      --error: #c0342b;
    }
    :root {
      --ink-900: #0d1218;
      --ink-850: #13191f;
      --ink-300: #94999e;
      --ink-100: #dee2e5;
      --surface: #13191f;
      --surface-2: rgba(32, 39, 47, .96);
      --surface-3: rgba(43, 51, 60, .96);
      --border: rgba(203, 213, 225, .14);
      --border-strong: rgba(203, 213, 225, .28);
      --text: var(--ink-100);
      --text-muted: var(--ink-300);
      --accent: #f7ac4d;
      --error: #ef675c;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 24px;
      --radius-panel: 16px;
      --radius-control: 4px;
      --topbar: 32px;
      --dur-feedback: 120ms;
      --dur-panel: 350ms;
      --ease-out: cubic-bezier(.2, .8, .25, 1);
      --font: system-ui, "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
    }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    #app { position: fixed; inset: 0; font-family: var(--font); color: var(--text); }
    canvas {
      position: fixed; top: 0; right: 0;
      display: block; background: transparent; image-rendering: pixelated;
      /* 独立合成层：页面其它地方重绘时，画布不会被丢掉一帧（透明窗口上会闪成桌面） */
      will-change: transform;
    }

    /* 顶栏：只有一条拖动把手，指针停下时才亮 */
    .drag {
      position: fixed; top: 0; left: 0; right: 0; height: var(--topbar);
      display: grid; place-items: center; cursor: grab; -webkit-app-region: drag;
    }
    .grip {
      width: 44px; height: 4px; border-radius: 2px;
      background: rgba(222, 226, 229, .55);
      box-shadow: 0 1px 2px rgba(5, 10, 15, .45);
      transition: background-color var(--dur-feedback) var(--ease-out);
    }
    .drag:hover .grip { background: rgba(222, 226, 229, .85); }

    /* 图标按钮：24 网格、2 线宽、颜色走 currentColor */
    .icon-button {
      display: grid; place-items: center; padding: 0;
      border: 0; border-radius: var(--radius-control); background: transparent;
      color: var(--text-muted); cursor: pointer;
      transition: background-color var(--dur-feedback) var(--ease-out),
        color var(--dur-feedback) var(--ease-out);
    }
    .icon-button svg { width: 18px; height: 18px; display: block; }
    .icon-button:hover { background: var(--surface-2); color: var(--text); }
    .icon-button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .icon-button:disabled { opacity: .5; cursor: default; }

    .gear { position: fixed; bottom: var(--space-2); right: var(--space-2); z-index: 15; width: var(--topbar); height: var(--topbar); }

    /* 菜单：一次只开一个，140ms 淡入，不做位移动画之外的编排 */
    .menu {
      position: fixed; right: var(--space-2); bottom: 48px; width: 176px; z-index: 20;
      box-sizing: border-box; display: grid; gap: 2px; padding: var(--space-2);
      border: 1px solid var(--border); border-radius: var(--radius-panel);
      background: var(--ink-850); color: var(--text);
      box-shadow: 0 8px 24px rgba(5, 10, 15, .45), 0 1px 2px rgba(5, 10, 15, .5);
    }
    .menu-group { position: relative; display: grid; }
    .menu-sep { height: 1px; margin: 2px; background: var(--border); }
    /* 二级菜单从所属组往左展开，仍在窗口里 */
    .submenu {
      position: absolute; right: 100%; top: -6px; margin-right: 4px; width: 200px;
      max-height: calc(100vh - 16px); overflow-y: auto;
      display: grid; gap: 2px; padding: var(--space-2); box-sizing: border-box;
      border: 1px solid var(--border); border-radius: var(--radius-panel);
      background: var(--ink-850); color: var(--text);
      box-shadow: 0 8px 24px rgba(5, 10, 15, .45), 0 1px 2px rgba(5, 10, 15, .5);
    }
    .submenu.up { top: auto; bottom: 0; }
    .menu-item {
      display: flex; align-items: center; gap: 6px; white-space: nowrap;
      min-height: var(--topbar); padding: 0 var(--space-2); border: 0; border-radius: var(--radius-control);
      background: transparent; color: inherit; font-family: var(--font); font-size: 14px; line-height: 1.4;
      text-align: left; cursor: pointer;
    }
    .menu-item > span { flex: 1; min-width: 0; }
    .menu-item .arrow { flex: none; width: 14px; height: 14px; opacity: .6; }
    .menu-item.open, .menu-item:hover { background: var(--surface-3); }
    .menu-item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

    /* 卡片：贴在窗口左缘的侧板，字号固定，不随画布缩放 */
    .card {
      position: fixed; top: 0; left: 0; bottom: 0; width: 300px; box-sizing: border-box;
      padding: var(--space-4); overflow-y: auto; z-index: 10;
      background: var(--surface); border-right: 1px solid var(--border);
      color: var(--text); font-size: 14px; line-height: 1.65;
      -webkit-app-region: no-drag;
      animation: card-in var(--dur-panel) var(--ease-out) both;
    }
    .card::-webkit-scrollbar { width: 8px; }
    .card::-webkit-scrollbar-thumb { background: rgba(203, 213, 225, .18); border-radius: 4px; }
    .card-head { display: flex; align-items: flex-start; gap: var(--space-2); }
    .card h2 {
      flex: 1; margin: 0; font-size: 18px; font-weight: 600; line-height: 1.3;
      overflow-wrap: anywhere;
    }
    .card-close {
      width: 32px; height: 32px; margin: -4px -4px 0 0;
      display: grid; place-items: center;
      border: 0; border-radius: var(--radius-control); background: transparent;
      color: var(--text-muted); cursor: pointer;
      transition: background-color var(--dur-feedback) var(--ease-out), color var(--dur-feedback) var(--ease-out);
    }
    .card-close svg { width: 18px; height: 18px; display: block; }
    .card-close:hover { background: var(--surface-3); color: var(--text); }
    .card-close:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .card .lead {
      display: flex; align-items: center; flex-wrap: wrap; gap: var(--space-2);
      margin-top: var(--space-1); color: var(--text-muted); font-size: 14px;
    }
    .card-section { margin-top: var(--space-4); padding-top: var(--space-3); border-top: 1px solid var(--border); }
    .card-section h3 { margin: 0 0 var(--space-2); color: var(--text-muted); font-size: 14px; font-weight: 600; }
    .card-row {
      display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-2);
      min-width: 0; padding: var(--space-1) 0; border-bottom: 1px solid rgba(203, 213, 225, .08);
    }
    .card-row:last-child { border-bottom: 0; }
    .card .row-main { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card .row-site {
      flex: none; max-width: 96px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      color: var(--text-muted); font-size: 12px;
    }
    .card .row-meta {
      flex: none; white-space: nowrap; color: var(--text-muted);
      font-size: 12px; font-variant-numeric: tabular-nums;
    }
    .card .trace-kind { flex: none; min-width: 36px; color: var(--text-muted); font-size: 12px; }
    .card .status-detail { white-space: pre-wrap; overflow-wrap: anywhere; }
    .card .control-row { display: flex; gap: var(--space-2); margin-top: var(--space-2); }
    .card .control-button {
      min-width: 64px; min-height: 32px; padding: 0 var(--space-3);
      border: 1px solid var(--border-strong); border-radius: var(--radius-control);
      background: var(--surface-2); color: var(--text);
      font-family: var(--font); font-size: 14px; line-height: 1.4; cursor: pointer;
      transition: background-color var(--dur-feedback) var(--ease-out), border-color var(--dur-feedback) var(--ease-out);
    }
    .card .control-button:hover { background: var(--surface-3); }
    .card .control-button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .card .control-button:disabled { opacity: .5; cursor: default; }
    .card .control-button.danger { color: var(--error); border-color: rgba(239, 103, 92, .45); }
    .card .control-button.danger:hover { background: rgba(239, 103, 92, .12); }
    .card .control-error { margin-top: var(--space-2); color: var(--error); font-size: 14px; }
    .card .card-error { margin-top: var(--space-2); color: var(--error); font-size: 14px; }
    .card .field { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); margin-top: var(--space-2); }
    .card .field-label { color: var(--text-muted); font-size: 13px; }
    .card .text-input {
      width: 96px; padding: 2px var(--space-2); border: 1px solid var(--border); border-radius: var(--radius-control);
      background: var(--surface-2); color: var(--text); font: inherit; font-size: 14px;
    }
    .card .chips { display: flex; gap: var(--space-2); margin-top: var(--space-2); }
    .card .chip {
      padding: 2px var(--space-3); border: 1px solid var(--border); border-radius: var(--radius-control);
      background: transparent; color: var(--text); font: inherit; font-size: 13px; cursor: pointer;
    }
    .card .chip.on { border-color: var(--accent); color: var(--accent); }
    .card .card-actions { display: flex; justify-content: flex-end; margin-top: var(--space-3); }
    .card .suggest-form { display: grid; gap: var(--space-2); margin-top: var(--space-2); }
    .card .suggest-input {
      width: 100%; box-sizing: border-box; resize: vertical; min-height: 56px; padding: var(--space-2);
      border: 1px solid var(--border); border-radius: var(--radius-control);
      background: var(--ink-900); color: var(--text);
      font-family: var(--font); font-size: 14px; line-height: 1.5;
    }
    .card .suggest-input:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
    .card .suggest-actions { display: flex; gap: var(--space-2); align-items: center; }
    .card .suggest-mode {
      min-height: 32px; padding: 0 var(--space-2); border: 1px solid var(--border); border-radius: var(--radius-control);
      background: var(--surface-2); color: var(--text); font-family: var(--font); font-size: 14px;
    }
    .card .suggest-mode:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .card .suggest-actions .control-button { margin-left: auto; }
    .card .ask-options { display: grid; gap: var(--space-2); margin: var(--space-2) 0; }
    .card .ask-option {
      width: 100%; height: auto; min-height: 32px; padding: var(--space-2);
      text-align: left; white-space: normal; line-height: 1.5;
    }
    .card .ask-context { margin-top: var(--space-2); white-space: pre-wrap; overflow-wrap: anywhere; }
    .card .path, .card .one-line { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .kv { display: flex; gap: var(--space-2); padding: 2px 0; }
    .kv .k { flex: none; min-width: 40px; color: var(--text-muted); font-size: 12px; line-height: 1.9; }
    .kv .v { flex: 1; word-break: break-word; }
    .muted { color: var(--text-muted); }
    .tag {
      flex: none; display: inline-flex; align-items: center; height: 18px; padding: 0 6px;
      border: 1px solid var(--border-strong); border-radius: var(--radius-control);
      color: var(--text-muted); font-size: 12px; line-height: 1;
    }

    /* 收起态摘要：贴在彩带左边，尺寸固定 */
    .summary {
      position: fixed; box-sizing: border-box; z-index: 12; padding: var(--space-3);
      background: var(--ink-850); border: 1px solid var(--border-strong); border-radius: var(--radius-panel);
      color: var(--text); cursor: pointer; font-size: 14px; line-height: 1.65;
      box-shadow: 0 8px 24px rgba(5, 10, 15, .45), 0 1px 2px rgba(5, 10, 15, .5);
    }
    .summary-head { display: flex; align-items: flex-start; gap: var(--space-2); }
    .summary h2 {
      flex: 1; min-width: 0; margin: 0 0 var(--space-1); font-size: 16px; font-weight: 600; line-height: 1.3;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .summary-close {
      width: 32px; height: 32px; margin: -6px -8px 0 0;
      display: grid; place-items: center;
      border: 0; border-radius: var(--radius-control); background: transparent;
      color: var(--text-muted); cursor: pointer;
      transition: background-color var(--dur-feedback) var(--ease-out), color var(--dur-feedback) var(--ease-out);
    }
    .summary-close svg { width: 16px; height: 16px; display: block; }
    .summary-close:hover { background: var(--surface-3); color: var(--text); }
    .summary-close:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .summary .row { display: flex; gap: var(--space-2); }
    .summary .k { flex: none; min-width: 32px; color: var(--text-muted); font-size: 12px; line-height: 1.9; }
    .summary .row > span:last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .summary .cta {
      display: flex; align-items: center; justify-content: space-between; gap: var(--space-2);
      margin-top: var(--space-2); color: var(--accent); font-weight: 600;
    }
    .summary .cta span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .summary .lock-ring { width: 14px; height: 14px; flex: none; transform: rotate(-90deg); }
    .summary .ring-track { fill: none; stroke: rgba(222, 226, 229, .18); stroke-width: 2; }
    .summary .ring-fill {
      fill: none; stroke: var(--text); stroke-width: 2; stroke-dasharray: 100; stroke-dashoffset: 100;
      animation: summary-ring 5s linear forwards;
    }
    .summary.locked .ring-fill { animation: none; stroke-dashoffset: 0; }
    @keyframes summary-ring { to { stroke-dashoffset: 0; } }

    .demo-tag {
      position: fixed; left: 8px; top: 4px; z-index: 14; padding: 0 6px;
      border: 1px solid var(--border-strong); border-radius: var(--radius-control);
      background: var(--surface); color: var(--accent); font-size: 12px; line-height: 18px;
      -webkit-app-region: drag;
    }

    /* 只滑不淡：卡片底不透明，淡入会在透明窗口上透出桌面，看着像闪 */
    @keyframes card-in { from { transform: translateX(-8px); } to { transform: none; } }

    @media (prefers-reduced-motion: reduce) {
      .card { animation: none; }
      .grip, .icon-button, .menu-item, .card .control-button { transition: none; }
      .summary .lock-ring { display: none; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="./renderer.js"></script>
</body>
</html>
